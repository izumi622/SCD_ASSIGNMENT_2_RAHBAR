name: CD
on:
  push:
    branches: [main]
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tests
        run: |
          python -m pip install -r api/requirements-dev.txt -r indexer/requirements-dev.txt
          python -m pip install pytest-cov==6.1.1
      - name: API coverage and tests
        working-directory: api
        run: python -m pytest -q tests --cov=app --cov-fail-under=60
      - name: Indexer tests
        working-directory: indexer
        run: python -m pytest -q tests
      - name: Evaluation tests
        run: python -m pytest -q eval/test_eval_metrics.py
      - uses: azure/setup-kubectl@v4
        with:
          version: 'v1.33.4'
      - name: Static manifest render
        run: kubectl kustomize k8s/overlays/prod >/tmp/rahbar-manifests.yaml

  build-push:
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Verify Docker Hub variable and token are configured
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          test -n "$DOCKERHUB_USERNAME" || { echo 'Set repository variable DOCKERHUB_USERNAME'; exit 1; }
          test -n "$DOCKERHUB_TOKEN" || { echo 'Set repository secret DOCKERHUB_TOKEN'; exit 1; }
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push API image with full commit SHA
        uses: docker/build-push-action@v7
        with:
          context: api
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
      - name: Build and push indexer image with full commit SHA
        uses: docker/build-push-action@v7
        with:
          context: indexer
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
      - name: Build and push UI image with full commit SHA
        uses: docker/build-push-action@v7
        with:
          context: ui
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-push]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test harness dependencies
        run: python -m pip install httpx==0.28.1 pyyaml==6.0.2
      - uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Pull only verified SHA-tagged images
        env:
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          docker pull "$REGISTRY_USER/rahbar-api:$GITHUB_SHA"
          docker pull "$REGISTRY_USER/rahbar-indexer:$GITHUB_SHA"
          docker pull "$REGISTRY_USER/rahbar-ui:$GITHUB_SHA"
      - uses: helm/kind-action@v1.14.0
        with:
          cluster_name: kind
      - name: Deploy SHA images into an ephemeral kind cluster, evaluate and test Ingress
        env:
          REGISTRY_USER: ${{ vars.DOCKERHUB_USERNAME }}
        run: |
          bash scripts/ci_fixture_cluster.sh \
            "$REGISTRY_USER/rahbar-api:$GITHUB_SHA" \
            "$REGISTRY_USER/rahbar-ui:$GITHUB_SHA" \
            "$REGISTRY_USER/rahbar-indexer:$GITHUB_SHA" --ingress
          kubectl -n rahbar rollout status deployment/api --timeout=180s
          kubectl -n rahbar rollout status deployment/ui --timeout=180s
