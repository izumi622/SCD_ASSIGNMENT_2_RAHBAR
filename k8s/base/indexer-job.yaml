# Apply only *after* the real corpus has been loaded into corpus-data PVC.
# Omitted from kustomization.yaml by design: an empty PVC should never start
# a dummy index that might overwrite real Chroma data.
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer-initial
  namespace: rahbar
spec:
  backoffLimit: 3
  template:
    metadata:
      labels: {app: indexer}
    spec:
      serviceAccountName: rahbar-indexer
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-chroma
          image: busybox:1.37.0
          command: ["/bin/sh", "-c"]
          args:
            - |
              i=0
              until wget -q -O - http://chroma:8000/api/v2/heartbeat >/dev/null 2>&1; do
                i=$((i+1))
                if [ "$i" -ge 120 ]; then echo 'Chroma not ready'; exit 1; fi
                sleep 2
              done
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 100m, memory: 32Mi}
      containers:
        - name: indexer
          image: rahbar-indexer:lowmem1
          imagePullPolicy: IfNotPresent
          args: []  # real extract-clean-chunk-embed-store pipeline; NEVER --dummy
          envFrom:
            - configMapRef: {name: rahbar-config}
          volumeMounts:
            - {name: corpus, mountPath: /corpus, readOnly: true}
            - {name: indexer-tmp, mountPath: /tmp}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 700m, memory: 1200Mi}
      volumes:
        - name: corpus
          persistentVolumeClaim: {claimName: corpus-data}
        - name: indexer-tmp
          emptyDir: {sizeLimit: 1Gi}
