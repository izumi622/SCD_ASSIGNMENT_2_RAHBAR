apiVersion: v1
kind: Service
metadata:
  name: fixture-embed
  namespace: rahbar
spec:
  type: ClusterIP
  selector: {app: fixture-embed}
  ports:
    - {name: http, port: 11434, targetPort: http}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fixture-embed
  namespace: rahbar
spec:
  replicas: 1
  selector:
    matchLabels: {app: fixture-embed}
  template:
    metadata:
      labels: {app: fixture-embed}
    spec:
      automountServiceAccountToken: false
      containers:
      - name: fixture-embed
        image: python:3.12.10-slim-bookworm
        command: ["python", "-u", "/srv/fixture/server.py"]
        ports:
          - {name: http, containerPort: 11434}
        volumeMounts:
          - {name: code, mountPath: /srv/fixture, readOnly: true}
        readinessProbe:
          httpGet: {path: /healthz, port: http}
          periodSeconds: 3
          failureThreshold: 20
        resources:
          requests: {cpu: 25m, memory: 48Mi}
          limits: {cpu: 250m, memory: 128Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 10001
          runAsGroup: 10001
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities: {drop: [ALL]}
      volumes:
        - name: code
          configMap:
            name: fixture-embed-code
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: fixture-embed-ingress
  namespace: rahbar
spec:
  podSelector:
    matchLabels: {app: fixture-embed}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [api, indexer]}
      ports:
        - {protocol: TCP, port: 11434}
